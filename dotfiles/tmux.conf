set -g default-terminal "tmux-256color"
set -g mouse on
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour0,fg=colour7"
set -g status-left-length 60
set -g status-right-length 150
set -g status-left "#[bg=colour4,fg=colour0,bold] #(whoami)@#H #[bg=colour0,fg=colour4]#[default] "
setw -g window-status-current-style "bg=colour8,fg=colour7,bold"
setw -g window-status-style "bg=colour0,fg=colour8"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g status-right "#(/usr/local/bin/mehh-statusbar)  #[bg=colour8,fg=colour7] %H:%M #[bg=colour5,fg=colour0,bold] %a %d %b "
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g message-style "bg=colour8,fg=colour7"
set -g mode-style "bg=colour4,fg=colour0"

# idle screensaver — DISABLED by default.
# hollywood/cmatrix spawn dozens of processes and can pin a weak box at high load.
# Enable by installing bin/mehh-screensaver (the installer does this) and
# uncommenting the two lines below.
set -g lock-after-time 0
# set -g lock-after-time 300
# set -g lock-command "/usr/local/bin/mehh-screensaver"

# ── TPM · tmux plugin manager ────────────────────────────────────────────────
# prefix + I installs plugins, prefix + U updates them.
# The run line MUST stay at the very bottom: tpm applies plugin settings as it
# loads, so anything after it can be overridden.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
run '~/.tmux/plugins/tpm/tpm'
